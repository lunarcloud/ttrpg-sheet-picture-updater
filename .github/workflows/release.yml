name: Release

# Builds the .deb/.rpm/AppImage packages (packaging/build-all.sh) and
# attaches them to the GitHub Release whenever one is published. Runs on
# ubuntu-latest, matching packaging/README.md's "build natively per
# architecture" note (pikepdf ships platform-specific wheels) — this
# produces x86_64 Linux artifacts only.
on:
  release:
    types: [published]

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # System libs needed both to *build* the PyInstaller binary (PyQt6's
      # native Qt modules must import successfully at freeze time) and by
      # appimagetool (which is itself an AppImage and needs FUSE to run —
      # avoided below via --appimage-extract-and-run instead of installing
      # libfuse2).
      - name: Install system Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1

      - name: Create venv and install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - name: Fetch packaging tools (nfpm, appimagetool)
        run: |
          # shellcheck source=packaging/lib/fetch-tools.sh
          source packaging/lib/fetch-tools.sh
          fetch_nfpm
          fetch_appimagetool

      - name: Build .deb, .rpm, and AppImage
        env:
          QT_QPA_PLATFORM: offscreen
          # appimagetool refuses to run without FUSE unless told to
          # extract-and-run instead (no FUSE available on GH runners).
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: ./packaging/build-all.sh

      - name: Verify VERSION matches the release tag
        run: |
          version="$(tr -d ' \t\n\r' < VERSION)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::warning::VERSION file ($version) does not match release tag ($GITHUB_REF_NAME) — attaching packages anyway."
          fi

      - name: Upload packages to the release
        run: gh release upload "$GITHUB_REF_NAME" dist/packages/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
