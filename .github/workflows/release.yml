name: Release

# Builds the .deb/.rpm/AppImage packages (packaging/build-all.sh), verifies
# the .deb/.rpm actually install and run on real Debian/Fedora systems (see
# "test-deb-install"/"test-rpm-install" below — this is the whole point of
# packaging/nfpm.yaml's `depends` relying on those distros' own
# python3-pyqt6/etc packages instead of bundling everything, so it's worth
# catching a wrong/missing package name before it reaches a release), then
# attaches all three artifacts to the GitHub Release whenever one is
# published. Builds on ubuntu-latest, matching packaging/README.md's "build
# natively per architecture" note (pikepdf ships platform-specific wheels)
# — this produces x86_64 Linux artifacts only.
#
# Versioning: releases must be tagged "release/<version>" (e.g.
# "release/1.2.3") or "v<version>" (e.g. "v1.2.3"). The very first step
# derives the actual package version from that tag
# (packaging/lib/compute-version.sh) and overwrites the committed
# .VERSION-PLACEHOLDER file with it before anything else builds — see that
# file and pyproject.toml for why it must never be hand-edited.
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compute version from the release tag
        run: |
          # .VERSION-PLACEHOLDER is committed as "0.0.0" and must never be
          # hand-bumped (see pyproject.toml/set_ttrpg_portrait/__init__.py
          # comments) — for real releases we overwrite it here, before
          # anything reads it, from the "release/#" or "v#.#.#" tag that
          # triggered this workflow. packaging/lib/compute-version.sh is
          # pure/testable (see tests/test_compute_version.py) so this step
          # just wires its output into the file the rest of the build
          # actually reads.
          packaging/lib/compute-version.sh "$GITHUB_REF_NAME" > .VERSION-PLACEHOLDER
          version="$(cat .VERSION-PLACEHOLDER)"
          echo "Resolved version: $version"
          if [ "$version" = "0.0.0" ]; then
            echo "::warning::Release tag '$GITHUB_REF_NAME' doesn't match 'release/<version>' or 'v<version>' — building as 0.0.0."
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Only the AppImage is PyInstaller-frozen (the .deb/.rpm ship this
      # project's plain Python source, relying on the distro's own
      # python3-pyqt6/etc packages instead — see packaging/README.md), but
      # PyInstaller still needs to successfully *import* PyQt6 to freeze
      # it, and appimagetool (itself an AppImage) needs FUSE to run
      # (avoided below via --appimage-extract-and-run instead of
      # installing libfuse2).
      - name: Install system Qt runtime libraries (for the AppImage build)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1

      - name: Create venv and install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - name: Fetch packaging tools (nfpm, appimagetool, linuxdeploy)
        run: |
          # shellcheck source=packaging/lib/fetch-tools.sh
          source packaging/lib/fetch-tools.sh
          fetch_nfpm
          fetch_appimagetool
          fetch_linuxdeploy

      - name: Build .deb, .rpm, and AppImage
        env:
          QT_QPA_PLATFORM: offscreen
          # appimagetool refuses to run without FUSE unless told to
          # extract-and-run instead (no FUSE available on GH runners).
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: ./packaging/build-all.sh

      - name: Upload built packages as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/packages/*
          retention-days: 1

  test-deb-install:
    needs: build
    runs-on: ubuntu-latest
    container: debian:stable
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist/packages

      - name: Install the .deb and its dependencies
        run: |
          apt-get update
          apt-get install -y ./dist/packages/*.deb

      - name: Smoke test the installed CLI and GUI entry points
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set-ttrpg-portrait --version
          set-ttrpg-portrait --help
          timeout 10 set-ttrpg-portrait-gui || [ "$?" -eq 124 ]

  test-rpm-install:
    needs: build
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist/packages

      - name: Install the .rpm and its dependencies
        run: dnf install -y ./dist/packages/*.rpm

      - name: Smoke test the installed CLI and GUI entry points
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set-ttrpg-portrait --version
          set-ttrpg-portrait --help
          timeout 10 set-ttrpg-portrait-gui || [ "$?" -eq 124 ]

  upload:
    needs: [build, test-deb-install, test-rpm-install]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist/packages

      - name: Upload packages to the release
        run: gh release upload "$GITHUB_REF_NAME" dist/packages/* --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

