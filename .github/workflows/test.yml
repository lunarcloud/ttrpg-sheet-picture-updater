name: Test

# Runs the formatter check + pytest suite against our own IP-free synthetic
# fixtures only (tests/fixtures/). Never depends on any real, copyrighted
# third-party sheets — see .github/copilot-instructions.md.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # ubuntu-latest runners are headless (no X11/Wayland) and are missing
    # several shared libraries that PyQt6's compiled Qt modules (e.g.
    # QtPdf/QtPdfWidgets used by set_ttrpg_portrait.gui) need just to be
    # *imported*, not only to render a window. QT_QPA_PLATFORM=offscreen
    # avoids needing a real display for anything that does init a QApplication.
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system Qt runtime libraries (for PyQt6 GUI imports)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1

      - name: Create venv and install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt -r requirements-dev.txt

      - name: Check formatting (black + isort)
        run: ./format.sh --check

      - name: Lint shell scripts (shellcheck)
        run: shellcheck --severity=warning $(find . -name "*.sh" -not -path "./.venv/*" -not -path "./build/*" -not -path "./dist/*")

      - name: Regenerate test fixtures
        run: .venv/bin/python tests/fixtures/generate_fixtures.py

      - name: Run pytest
        run: .venv/bin/python -m pytest tests/ -v
