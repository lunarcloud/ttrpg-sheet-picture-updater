# Shared nfpm package definition — one config produces both the .deb and
# .rpm via `nfpm package --packager deb|rpm`. See "Distribution / Packaging"
# in packaging/README.md.
#
# NOTE: nfpm does NOT expand env vars in contents[].src (only in top-level
# fields like `version`) — https://github.com/goreleaser/nfpm/issues/719.
# So content paths below are fixed, relative to the repo root, and
# build-deb.sh/build-rpm.sh always stage into that exact path
# (build/stage/) and invoke nfpm with the repo root as their working
# directory, since nfpm resolves relative `src` paths against its CWD.
name: set-ttrpg-portrait
version: ${VERSION}
arch: amd64
platform: linux
section: utils
priority: optional
maintainer: lunarcloud
description: Embed a portrait image into a fillable TTRPG character sheet PDF.
homepage: https://github.com/lunarcloud/ttrpg-sheet-picture-updater
license: MIT

contents:
  - src: build/stage/usr/bin/set-ttrpg-portrait
    dst: /usr/bin/set-ttrpg-portrait
    file_info:
      mode: 0755

  - src: build/stage/usr/bin/set-ttrpg-portrait-gui
    dst: /usr/bin/set-ttrpg-portrait-gui
    file_info:
      mode: 0755

  # This project's own pure-Python code (staged by
  # packaging/lib/stage-files.sh's `pip install --no-deps --target=...`,
  # including its generated .dist-info so `importlib.metadata.version(...)`
  # — the single source of truth for `set_ttrpg_portrait.__version__` —
  # keeps working once installed). Kept out of the distro's own versioned
  # site-packages/dist-packages tree; the two launchers above add this
  # directory to `sys.path` themselves. See packaging/README.md.
  - src: build/stage/usr/share/set-ttrpg-portrait/lib/
    dst: /usr/share/set-ttrpg-portrait/lib/
    type: tree

  - src: build/stage/usr/share/applications/set-ttrpg-portrait-gui.desktop
    dst: /usr/share/applications/set-ttrpg-portrait-gui.desktop

  - src: build/stage/usr/share/doc/set-ttrpg-portrait/README.md
    dst: /usr/share/doc/set-ttrpg-portrait/README.md

  - src: build/stage/usr/share/doc/set-ttrpg-portrait/LICENSE
    dst: /usr/share/doc/set-ttrpg-portrait/LICENSE

  - src: build/stage/usr/share/icons/hicolor/16x16/apps/set-ttrpg-portrait.png
    dst: /usr/share/icons/hicolor/16x16/apps/set-ttrpg-portrait.png
  - src: build/stage/usr/share/icons/hicolor/32x32/apps/set-ttrpg-portrait.png
    dst: /usr/share/icons/hicolor/32x32/apps/set-ttrpg-portrait.png
  - src: build/stage/usr/share/icons/hicolor/48x48/apps/set-ttrpg-portrait.png
    dst: /usr/share/icons/hicolor/48x48/apps/set-ttrpg-portrait.png
  - src: build/stage/usr/share/icons/hicolor/64x64/apps/set-ttrpg-portrait.png
    dst: /usr/share/icons/hicolor/64x64/apps/set-ttrpg-portrait.png
  - src: build/stage/usr/share/icons/hicolor/128x128/apps/set-ttrpg-portrait.png
    dst: /usr/share/icons/hicolor/128x128/apps/set-ttrpg-portrait.png
  - src: build/stage/usr/share/icons/hicolor/256x256/apps/set-ttrpg-portrait.png
    dst: /usr/share/icons/hicolor/256x256/apps/set-ttrpg-portrait.png

# The .deb/.rpm launchers above are plain Python scripts (NOT PyInstaller-
# frozen — that's only the AppImage, which has no host package manager to
# lean on) — they import PyQt6/pikepdf/Pillow/PyMuPDF/cairosvg from the distro's own
# packages at runtime, so those need to be declared here. Doing it this way
# means we don't need to hand-maintain the transitive closure of lower-level
# system libraries (X11/XCB, EGL/GL, D-Bus, fontconfig, freetype, glib,
# Wayland, ...) ourselves — apt/dnf already do that automatically via each
# of these packages' own declared dependencies.
#
# nfpm has no distro-agnostic dependency mechanism (its `depends:` is a
# plain list of strings passed straight to dpkg/rpm — see nfpm's own
# jsonschema, `$defs.Overridables.properties.depends`), so the same
# Python package needs a different declared system-package name per format.
# MSIX-specific settings (a top-level sibling of `contents`/`overrides`,
# not nested under `overrides` — see nfpm's own Info struct). `arch: amd64`
# above auto-maps to MSIX's "x64" nomenclature.
#
# `publisher` MUST exactly match the Subject of whatever certificate signs
# the package (see `signature.pfx_file` below) — Windows refuses to install
# an MSIX otherwise. This project has no paid code-signing certificate, so
# build-msix.sh generates an ephemeral self-signed one at build time with
# a matching Subject; see packaging/README.md's MSIX section for the
# resulting "users must manually trust this certificate" caveat.
msix:
  publisher: "${MSIX_PUBLISHER}"
  properties:
    display_name: set-ttrpg-portrait
    publisher_display_name: lunarcloud
    # Referenced as a package-relative destination path, not a local file —
    # see overrides.msix.contents below, which stages the actual PNG there.
    logo: Assets/StoreLogo.png
  applications:
    - id: SetTtrpgPortrait
      executable: app/set-ttrpg-portrait-launcher.exe
      visual_elements:
        square150x150_logo: Assets/Square150x150Logo.png
        square44x44_logo: Assets/Square44x44Logo.png
  signature:
    pfx_file: "${MSIX_PFX_FILE}"

overrides:
  # Replaces (not merges with) the shared `contents:` above — MSIX ships a
  # PyInstaller-frozen one-dir build (build-msix.sh's `build/msix-stage/`)
  # rather than this project's plain Python source, since the .deb/.rpm's
  # "lean on the distro's own compiled packages" approach has no Windows
  # equivalent.
  msix:
    contents:
      - src: build/msix-stage/app/
        dst: app/
        type: tree
      - src: packaging/msix/Assets/Square150x150Logo.png
        dst: Assets/Square150x150Logo.png
      - src: packaging/msix/Assets/Square44x44Logo.png
        dst: Assets/Square44x44Logo.png
      - src: packaging/msix/Assets/StoreLogo.png
        dst: Assets/StoreLogo.png
  deb:
    depends:
      - python3 (>= 3.10)
      - python3-pyqt6 # PyQt6
      - python3-pikepdf # pikepdf
      - python3-pil # Pillow
      - python3-pymupdf # pymupdf (a.k.a. fitz), used for the GUI's sheet preview
      - python3-cairosvg # cairosvg, used to rasterize SVG portraits
  rpm:
    depends:
      - python3 >= 3.10
      - python3-pyqt6 # PyQt6
      - python3-pikepdf # pikepdf
      - python3-pillow # Pillow
      - python3-PyMuPDF # pymupdf (a.k.a. fitz), used for the GUI's sheet preview
      - python3-cairosvg # cairosvg, used to rasterize SVG portraits

