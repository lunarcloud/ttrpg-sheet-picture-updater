# Shared nfpm package definition — one config produces both the .deb and
# .rpm via `nfpm package --packager deb|rpm`. See "Distribution / Packaging"
# in packaging/README.md.
#
# NOTE: nfpm does NOT expand env vars in contents[].src (only in top-level
# fields like `version`) — https://github.com/goreleaser/nfpm/issues/719.
# So content paths below are fixed, relative to the repo root, and
# build-deb.sh/build-rpm.sh always stage into that exact path
# (build/stage/) and invoke nfpm with the repo root as their working
# directory, since nfpm resolves relative `src` paths against its CWD.
name: set-ttrpg-portrait
version: ${VERSION}
arch: amd64
platform: linux
section: utils
priority: optional
maintainer: lunarcloud
description: Embed a portrait image into a fillable TTRPG character sheet PDF.
homepage: https://github.com/lunarcloud/ttrpg-sheet-picture-updater
license: MIT

contents:
  - src: build/stage/usr/bin/set-ttrpg-portrait
    dst: /usr/bin/set-ttrpg-portrait
    file_info:
      mode: 0755

  - src: build/stage/usr/bin/set-ttrpg-portrait-gui
    dst: /usr/bin/set-ttrpg-portrait-gui
    file_info:
      mode: 0755

  - src: build/stage/usr/share/applications/set-ttrpg-portrait-gui.desktop
    dst: /usr/share/applications/set-ttrpg-portrait-gui.desktop

  - src: build/stage/usr/share/doc/set-ttrpg-portrait/README.md
    dst: /usr/share/doc/set-ttrpg-portrait/README.md

  - src: build/stage/usr/share/doc/set-ttrpg-portrait/LICENSE
    dst: /usr/share/doc/set-ttrpg-portrait/LICENSE

  - src: build/stage/usr/share/icons/hicolor/16x16/apps/set-ttrpg-portrait.png
    dst: /usr/share/icons/hicolor/16x16/apps/set-ttrpg-portrait.png
  - src: build/stage/usr/share/icons/hicolor/32x32/apps/set-ttrpg-portrait.png
    dst: /usr/share/icons/hicolor/32x32/apps/set-ttrpg-portrait.png
  - src: build/stage/usr/share/icons/hicolor/48x48/apps/set-ttrpg-portrait.png
    dst: /usr/share/icons/hicolor/48x48/apps/set-ttrpg-portrait.png
  - src: build/stage/usr/share/icons/hicolor/64x64/apps/set-ttrpg-portrait.png
    dst: /usr/share/icons/hicolor/64x64/apps/set-ttrpg-portrait.png
  - src: build/stage/usr/share/icons/hicolor/128x128/apps/set-ttrpg-portrait.png
    dst: /usr/share/icons/hicolor/128x128/apps/set-ttrpg-portrait.png
  - src: build/stage/usr/share/icons/hicolor/256x256/apps/set-ttrpg-portrait.png
    dst: /usr/share/icons/hicolor/256x256/apps/set-ttrpg-portrait.png
