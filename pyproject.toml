[project]
name = "set-ttrpg-portrait"
dynamic = ["version"]
description = "Embed a portrait image into a fillable TTRPG character sheet PDF."
readme = "README.md"
license = "MIT"
authors = [{ name = "Sam Sarette" }]
requires-python = ">=3.10"
dependencies = [
    "pikepdf==10.11.0",
    "pillow==12.3.0",
    "PyQt6==6.11.0",
    # Used by the GUI to render the sheet preview: Qt's own QtPdf/QPdfView
    # module doesn't render AcroForm field appearances (values or icons)
    # at all, so PyMuPDF renders each page to an image instead.
    "pymupdf==1.28.0",
]

[project.urls]
Homepage = "https://github.com/lunarcloud/ttrpg-sheet-picture-updater"
Issues = "https://github.com/lunarcloud/ttrpg-sheet-picture-updater/issues"

# Console entry points — installed to .venv/bin (or an editable-install's
# bin dir) when this project is `pip install`-ed, so `set-ttrpg-portrait`/
# `set-ttrpg-portrait-gui` work directly without needing the root-level
# `set_ttrpg_portrait.py`/`set_ttrpg_portrait_gui.py` shim scripts.
[project.scripts]
set-ttrpg-portrait = "set_ttrpg_portrait.cli:main"

[project.gui-scripts]
set-ttrpg-portrait-gui = "set_ttrpg_portrait.gui:main"

# Build/test-only tools — kept separate from the runtime `dependencies`
# above so end users installing the packaged .deb/.rpm/AppImage don't need
# them. Install with `pip install -e ".[dev]"`.
[project.optional-dependencies]
dev = [
    "pytest",
    "pyinstaller",
    "ruff==0.16.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
include = ["set_ttrpg_portrait*"]

[tool.setuptools.package-data]
# Qt Designer form loaded at runtime by set_ttrpg_portrait/gui/main_window.py
# — not Python source, so it needs an explicit package-data entry to be
# included in non-editable installs/wheels.
"set_ttrpg_portrait.gui" = ["*.ui"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# A modern, broader rule set than the old black+isort combo (which only
# formatted and sorted imports, catching zero actual bugs):
#   E/W   - pycodestyle
#   F     - pyflakes (unused imports/vars, undefined names, etc.)
#   I     - isort (import sorting/grouping)
#   UP    - pyupgrade (modernize syntax to the target Python version)
#   B     - flake8-bugbear (common bug-prone patterns)
#   C4    - flake8-comprehensions (unnecessary/inefficient comprehensions)
#   SIM   - flake8-simplify (needlessly convoluted code)
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.format]
# Matches the line-length/quote-style Black previously enforced, so this
# change doesn't churn the whole codebase's formatting.
quote-style = "double"
